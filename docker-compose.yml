# =============================================
# Cancer Fusion AI - docker-compose.yml
# Development and production deployment configuration
# =============================================

version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - DATA_PATH=/app/data
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Training service for retraining models
  trainer:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - DATA_PATH=/app/data
      - PYTHONPATH=/app/src
    command: >
      sh -c "python -m src.train --config configs/config.yaml"
    # Uncomment to run training automatically on startup
    # profiles: ["train"]

